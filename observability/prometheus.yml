# Scraped over the compose network; the API's metrics port is not published to the host.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ff_api
    static_configs:
      - targets: ["ff_api:9105"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
