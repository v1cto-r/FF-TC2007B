# Limits for talking to the S3 storage (RustFS). Who may upload / read what is decided in code
# (app/storage/rules.py) from the database; this file only says WHAT is acceptable.

# Kinds of file: allowed content types and the biggest size
kinds:
  image:
    content_types:
      - image/jpeg
      - image/png
      - image/webp
    max_bytes: 5242880
  file:
    content_types:
      - application/pdf
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
    max_bytes: 10485760

# Which buckets exist and which kinds each one may hold
buckets:
  estancias: {kinds: [image]}
  images:    {kinds: [image]}
  files:     {kinds: [image, file]}   # a document can be a scan or a photo too

# Where each purpose is stored, and which kinds it accepts
purposes:
  ACTIVITY_IMAGE:     {bucket: images,    kinds: [image]}
  MESSAGE_ATTACHMENT: {bucket: images,    kinds: [image]}
  CHILD_PHOTO:        {bucket: images,    kinds: [image]}
  USER_AVATAR:        {bucket: images,    kinds: [image]}
  ESTANCIA_LOGO:      {bucket: estancias, kinds: [image]}
  CHILD_DOCUMENT:     {bucket: files,     kinds: [image, file]}
  PICKUP_ID_PHOTO:    {bucket: images,    kinds: [image]}

# Fixed windows, per user, counted in Postgres (see app/rate_limit.py)
rate_limits:
  upload:   {per_minute: 10, per_day: 200}
  download: {per_minute: 300}
