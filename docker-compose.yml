name: ff-deploy

networks:
  edge:
    external: true

services:
  ff_api:
    build:
      context: ./api
    container_name: FF_Api
    env_file: .env
    environment:
      DB_HOST: ff_postgres
      S3_HOST: ff_rustfs
      S3_PORT: "9000"
    ports:
      - "5005:5005"
    restart: unless-stopped
    depends_on:
      - ff_postgres
      - ff_rustfs

  ff_postgres:
    image: postgres:18
    container_name: FF_Postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5002:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

  ff_rustfs:
    image: rustfs/rustfs:latest
    container_name: FF_RustFS
    ports:
      - "5003:9000" # S3 API Port
      - "5004:9001" # Web Console Port
    volumes:
      - rustfs_data:/data
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    restart: unless-stopped

volumes:
  rustfs_data:
  postgres_data:
